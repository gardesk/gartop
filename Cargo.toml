[workspace]
resolver = "2"
members = ["gartop", "gartopctl", "gartop-ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["mfwolffe"]
license = "MIT"

[workspace.dependencies]
# Shared IPC types
gartop-ipc = { path = "gartop-ipc" }

# gartk toolkit
gartk-core = { path = "../gartk/gartk-core" }
gartk-x11 = { path = "../gartk/gartk-x11" }
gartk-render = { path = "../gartk/gartk-render" }

# X11
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr"] }

# Cairo rendering
cairo-rs = { version = "0.20", features = ["png"] }

# System data
procfs = "0.18"

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Utilities
dirs = "5"
nix = { version = "0.29", features = ["signal"] }
users = "0.11"

# Netlink for socket diagnostics
netlink-packet-sock-diag = "0.4"
netlink-packet-core = "0.7"
netlink-sys = "0.8"
